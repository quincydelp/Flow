services:
  flow:
    build: .
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      FLOW_MODEL: ${FLOW_MODEL:-openai:gpt-5-mini}
      FLOW_SOCIAL_MODE: ${FLOW_SOCIAL_MODE:-live}
      FLOW_DATA_DIR: /data
    volumes:
      - flow-data:/data
      - ./workflows:/app/workflows

volumes:
  flow-data:
